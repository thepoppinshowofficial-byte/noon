    html,

      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      min-height: 100vh;
      color: #ffffff;
      overflow-x: hidden;

      background:

          circle at 15% 10%,
          rgba(255, 183, 77, 0.14),

          #17120c 50%,

        );
    }

    /* PAGE */

    .page {
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 18px;

      position: relative;
      overflow: hidden;
    }

    /* BACKGROUND GLOW */

    .glow {
      position: absolute;
      width: 480px;
      height: 480px;

      border-radius: 50%;

      filter: blur(110px);

      pointer-events: none;
    }

    .glow-one {
      top: -230px;
      right: -160px;

      background: rgba(255, 174, 58, 0.13);
    }

    .glow-two {
      bottom: -240px;
      left: -180px;

      background: rgba(255, 255, 255, 0.08);
    }

    /* MAIN BANNER */

    .banner {
      width: min(1200px, 100%);
      min-height: calc(100vh - 36px);

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 70px 40px 40px;

      border-radius: 30px;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.075),
          rgba(255,255,255,0.018)
        );

      border: 1px solid rgba(255, 184, 77, 0.24);

      box-shadow:
        0 35px 100px rgba(0,0,0,0.65),
        inset 0 1px rgba(255,255,255,0.10);
    }

    /* DECORATIVE RINGS */

    .ring {
      position: absolute;

      border-radius: 50%;

      border: 1px solid rgba(255, 184, 77, 0.10);

      pointer-events: none;
    }

    .ring-one {
      width: 650px;
      height: 650px;

      right: -390px;
      top: 50%;

      transform: translateY(-50%);
    }

    .ring-two {
      width: 430px;

      top: -100px;
    }

    /* TOP LABEL */

    .flash-label {
      position: absolute;

      left: 50%;

      transform: translateX(-50%);

      padding: 9px 24px;

      border-radius: 50px;

      background:
        linear-gradient(
          135deg,
          #f5b94d,
          #d88716

      font-size: 13px;
      font-weight: 900;

      white-space: nowrap;

      box-shadow:

    }

    .content {
      width: 100%;
      max-width: 900px;

      text-align: center;

      position: relative;
      z-index: 3;
    }

    .brand {
      font-size: 28px;

      color: #ffffff;

      margin-bottom: 12px;

      color: #f2a832;
    }

    .geo-list {
      display: flex;

      color: #cfc7b7;

    }

      color: #f1a832;

      text-shadow:

    }

    .description {
      max-width: 720px;

      margin: 0 auto 25px;

      color: #d0ccc4;

      font-size: clamp(16px, 2vw, 21px);

      line-height: 1.8;
    }

    .description strong {
      color: #f4b64d;
    }

    .offer {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 17px;

      padding: 12px 28px;

      margin-bottom: 25px;

      border-radius: 18px;

      background: rgba(241,168,50,0.08);

      border: 1px solid rgba(241,168,50,0.28);

      animation: offerPulse 2.2s infinite;
    }

    .offer-percent {
      font-size: 46px;

      font-weight: 900;

      color: #f2aa38;
    }

      font-size: 14px;

      color: #eeeeee;

      line-height: 1.5;
    }
