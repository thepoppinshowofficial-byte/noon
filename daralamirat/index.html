  <script>
    const COUPON_CODE = "LM77";
    const STORE_URL = "https://daralamirat.com.sa/ar";

    const offerButton = document.getElementById("offerButton");
    const statusMessage = document.getElementById("statusMessage");

    async function copyCoupon() {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(COUPON_CODE);
          return true;
        }

        const textArea = document.createElement("textarea");
        textArea.value = COUPON_CODE;
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";

        document.body.appendChild(textArea);
        textArea.select();

        const copied = document.execCommand("copy");
        textArea.remove();

        return copied;
      } catch (error) {
        return false;
      }
    }

    offerButton.addEventListener("click", async () => {
      offerButton.disabled = true;

      statusMessage.textContent = "جارٍ تجهيز كود الخصم...";

      const copied = await copyCoupon();

      if (copied) {
        statusMessage.textContent =
          "تم نسخ الكود LM77. جارٍ فتح المتجر...";
      } else {
        statusMessage.textContent =
          "انسخ الكود LM77 يدويًا إذا لزم الأمر. جارٍ فتح المتجر...";
      }

      window.setTimeout(() => {
        window.location.href = STORE_URL;
      }, 700);
    });
  </script>
